name: Release (gui-native)

# Native Slint GUI release. Builds on each runner OS natively
# (no cross-compile — Slint cross-compile is fragile across
# Wayland / Cocoa / GDI). Produces per-OS tar.gz / zip with the
# binary + assets.
#
# See release ceremony prep audit (2026-05-21).
#
# The `build` job signs and notarizes with secrets from the protected
# `release` environment, so it runs only on a v* tag push (after a
# required reviewer approves). A manual dispatch does not build or
# publish; to rebuild, delete and re-push the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish or rebuild'
        required: true
        type: string
      publish_release:
        description: 'Publish immediately instead of draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_TERM_COLOR: always
  # Force lzma-sys / xz2 to build liblzma from source and link it
  # statically. Otherwise the macOS runner's Homebrew xz gets dynamically
  # linked into the binary (load path `/opt/homebrew/opt/xz/lib/liblzma.5.dylib`)
  # and the hardened-runtime + Developer-ID-signed app refuses to load it
  # on user machines because it's signed by a different Team ID — crashing
  # at launch with "Library not loaded: …liblzma.5.dylib … different Team IDs".
  LZMA_API_STATIC: "1"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    # Signing secrets live in the protected `release` environment (required
    # reviewer, v* tags only). Only a v* tag push runs this job; PR CI and
    # manual dispatches never reach the environment.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            os: linux
          - target: x86_64-apple-darwin
            # macos-13 was retired by GitHub (2025-12) — jobs queue forever.
            # macos-15-intel is the supported Intel runner label.
            runner: macos-15-intel
            archive: tar.gz
            os: macos
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            os: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            os: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          submodules: recursive

      # Same 3-deploy-key SSH alias scheme as ci.yml — the cargo git deps
      # resolve via github-citrate-* host aliases. Without this the build
      # dies at `cargo metadata` (v0.4.0-beta.1 first-run failure).
      - name: Setup SSH agent (3 deploy keys via per-host aliases)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.CHAIN_DEPLOY_KEY }}
            ${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}
            ${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}

      - name: Configure SSH host aliases
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          umask 077
          echo "${{ secrets.CHAIN_DEPLOY_KEY }}" > ~/.ssh/citrate-chain-readonly
          echo "${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}" > ~/.ssh/citrate-learning-center-readonly
          echo "${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}" > ~/.ssh/citrate-agent-runtime-readonly
          chmod 600 ~/.ssh/citrate-*-readonly

          cat > ~/.ssh/config <<'SSHEOF'
          Host github-citrate-chain
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-chain-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-learning-center
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-learning-center-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-agent-runtime
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-agent-runtime-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          SSHEOF
          chmod 600 ~/.ssh/config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Slint system deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-cursor-dev libxcb-shm0-dev libxcb-xkb-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev libsecret-1-dev \
            libdbus-1-dev libssl-dev pkg-config cmake

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build GUI binaries
        shell: bash
        run: |
          set -e
          cargo build --release --locked --target ${{ matrix.target }}
          ls -la "target/${{ matrix.target }}/release" | head -20

      # Guard: the shipped binary must not link dylibs from the runner's
      # Homebrew / /usr/local prefix. Those libs are signed by a different
      # Team ID, so the hardened-runtime Developer-ID app dies at launch on
      # user machines (DYLD "Library missing"). Fails the build instead of
      # shipping a DMG that crashes on open.
      - name: Verify no Homebrew dylib links (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/citrate-native"
          otool -L "$BIN"
          BAD=$(otool -L "$BIN" | tail -n +2 | grep -E '/opt/homebrew|/usr/local' || true)
          if [[ -n "$BAD" ]]; then
            echo "::error::binary links non-system dylibs that will not load on user machines:"
            echo "$BAD"
            exit 1
          fi

      # macOS signing: Developer ID + hardened runtime. Skips gracefully
      # (unsigned artifact, loud notice) when the cert secrets are absent
      # so forks/branches still produce artifacts.
      - name: Import Developer ID certificate (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          set -e
          if [[ -z "${MACOS_CERT_P12:-}" ]]; then
            echo "::warning::MACOS_CERT_P12 not set — macOS artifact will be UNSIGNED"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' 'NR==1{print $2}')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      # macOS ships a real .app bundle — a Slint GUI is not launchable from
      # Finder as a bare Mach-O executable ("does not seem to be an app").
      # The .app is signed deep + hardened runtime; the tar.gz carries the
      # .app and the DMG adds a drag-to-Applications symlink.
      - name: Build + sign .app bundle (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -e
          STAGE="citrate-native-${{ matrix.target }}"
          APP="dist/$STAGE/Citrate Native.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/citrate-native" "$APP/Contents/MacOS/citrate-native"
          chmod +x "$APP/Contents/MacOS/citrate-native"
          cp branding/icons/citrate.icns "$APP/Contents/Resources/citrate.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Citrate Native</string>
            <key>CFBundleDisplayName</key><string>Citrate Native</string>
            <key>CFBundleIdentifier</key><string>ai.citrate.native</string>
            <key>CFBundleVersion</key><string>0.4.0</string>
            <key>CFBundleShortVersionString</key><string>0.4.0</string>
            <key>CFBundleExecutable</key><string>citrate-native</string>
            <key>CFBundleIconFile</key><string>citrate.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cp LICENSE README.md "dist/$STAGE/" 2>/dev/null || true
          if [[ -n "${SIGN_IDENTITY:-}" ]]; then
            codesign --force --deep --options runtime --timestamp \
              --sign "$SIGN_IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          else
            echo "::warning::no identity — .app is UNSIGNED"
          fi
          cd dist && tar -czf "$STAGE.tar.gz" "$STAGE/"

      - name: Package release archive
        if: matrix.os != 'macos'
        shell: bash
        run: |
          set -e
          STAGE="citrate-native-${{ matrix.target }}"
          mkdir -p "dist/$STAGE"
          TARGET_DIR="target/${{ matrix.target }}/release"

          # Copy all built binaries (Slint native GUIs)
          for entry in "$TARGET_DIR"/*; do
            name=$(basename "$entry")
            # Skip libraries, build artifacts, dirs we don't want
            if [[ -f "$entry" && -x "$entry" ]] || [[ "$name" == *.exe ]]; then
              # Heuristic: copy if it has no extension OR is .exe and is in the top-level (not deps/)
              case "$name" in
                *.d|*.rlib|*.so|*.dylib|*.dll|*.pdb) ;;
                *) cp "$entry" "dist/$STAGE/" 2>/dev/null || true ;;
              esac
            fi
          done

          cp LICENSE README.md "dist/$STAGE/" 2>/dev/null || true

          # Copy assets if any
          if [[ -d "assets" ]]; then
            cp -r assets "dist/$STAGE/"
          fi

          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a -tzip "${STAGE}.zip" "$STAGE/"
          else
            tar -czf "${STAGE}.tar.gz" "$STAGE/"
          fi

      # Notarize + stapled DMG (macOS, signed builds only). One notarytool
      # submission of the DMG covers the nested binaries' cdhashes, so the
      # tar.gz binary passes online Gatekeeper too; the DMG additionally
      # verifies OFFLINE because the ticket is stapled to it.
      - name: Notarize + DMG (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Preferred CI auth: App Store Connect API key (survives Apple ID
          # password changes; app-specific passwords are revoked by them).
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -e
          [[ -z "${SIGN_IDENTITY:-}" ]] && { echo "unsigned build — skipping notarization"; exit 0; }
          NOTARY_ARGS=()
          if [[ -n "${NOTARY_KEY_P8:-}" ]]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            NOTARY_ARGS=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            NOTARY_ARGS=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          else
            echo "::warning::no notary secrets set — signed but NOT notarized"
            exit 0
          fi
          STAGE="citrate-native-${{ matrix.target }}"
          # DMG layout: the .app + a drag-to-Applications symlink (standard
          # install UX). docs stay in the tar.gz, not the DMG.
          DMGROOT="$RUNNER_TEMP/dmgroot"
          rm -rf "$DMGROOT"; mkdir -p "$DMGROOT"
          cp -R "dist/$STAGE/Citrate Native.app" "$DMGROOT/"
          ln -s /Applications "$DMGROOT/Applications"
          hdiutil create -volname "Citrate Native" -srcfolder "$DMGROOT" \
            -ov -format UDZO "dist/$STAGE.dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "dist/$STAGE.dmg"
          xcrun notarytool submit "dist/$STAGE.dmg" "${NOTARY_ARGS[@]}" --wait
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "dist/$STAGE.dmg"
          # Verify: dmg (stapled) + bare binary (online ticket via cdhash)
          spctl -a -t open --context context:primary-signature -vv "dist/$STAGE.dmg" || true
          spctl -a -t exec -vv "dist/$STAGE/citrate-native" || true

      - name: SHA256
        shell: bash
        run: |
          cd dist
          for f in citrate-native-${{ matrix.target }}.*; do
            if [[ -f "$f" ]]; then
              if [[ "${{ runner.os }}" == "macOS" ]]; then
                shasum -a 256 "$f" > "$f.sha256"
              else
                sha256sum "$f" > "$f.sha256"
              fi
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: citrate-native-${{ matrix.target }}
          path: dist/citrate-native-${{ matrix.target }}.*
          retention-days: 30

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: Setup SSH agent (3 deploy keys via per-host aliases)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.CHAIN_DEPLOY_KEY }}
            ${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}
            ${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}
      - name: Configure SSH host aliases
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          umask 077
          echo "${{ secrets.CHAIN_DEPLOY_KEY }}" > ~/.ssh/citrate-chain-readonly
          echo "${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}" > ~/.ssh/citrate-learning-center-readonly
          echo "${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}" > ~/.ssh/citrate-agent-runtime-readonly
          chmod 600 ~/.ssh/citrate-*-readonly
          cat > ~/.ssh/config <<'SSHEOF'
          Host github-citrate-chain
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-chain-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-learning-center
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-learning-center-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-agent-runtime
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-agent-runtime-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          SSHEOF
          chmod 600 ~/.ssh/config
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps for SBOM
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config cmake
      - run: cargo install --locked cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename citrate-native-sbom
      - uses: actions/upload-artifact@v4
        with:
          name: citrate-native-sbom
          # cargo-cyclonedx writes per-crate SBOMs into each crate dir,
          # not the workspace root — glob recursively or the artifact is
          # silently empty (upload-artifact only warns).
          path: '**/citrate-native-sbom*.json'
          if-no-files-found: error
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [build, sbom]
    permissions:
      contents: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' -o -name '*.json' \) -exec cp {} release-files/ \;
      - id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: citrate-native ${{ steps.tag.outputs.tag }}
          # String comparison, not `!inputs.x` — dispatch inputs are strings,
          # so `!'false'` is false and the release self-publishes. Draft
          # unless explicitly published (tag pushes always draft).
          draft: ${{ github.event.inputs.publish_release != 'true' }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release-files/*
          body: |
            ## citrate-native ${{ steps.tag.outputs.tag }}

            Native Slint desktop application — operator + partner UI
            for the Citrate Network.

            ### Artifacts (per OS)
            - Linux x86_64 — tar.gz
            - macOS Intel + Apple Silicon — tar.gz
            - Windows x86_64 — zip

            See `citrate-compliance/runbooks/releases/gui-native.md`
            for install + first-run instructions.

            **Status**: unsigned-pre-release. macOS users will see
            Gatekeeper warning; right-click → Open to bypass.
            Windows users will see SmartScreen warning; click "More
            info" → "Run anyway" to bypass. Both warnings are
            resolved when code-signing certs are wired (see
            release ceremony prep audit's SIGNING_CHECKLIST.md).
