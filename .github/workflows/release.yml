name: Release (gui-native)

# Native Slint GUI release. Builds on each runner OS natively
# (no cross-compile — Slint cross-compile is fragile across
# Wayland / Cocoa / GDI). Produces per-OS tar.gz / zip with the
# binary + assets.
#
# See release ceremony prep audit (2026-05-21).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish or rebuild'
        required: true
        type: string
      publish_release:
        description: 'Publish immediately instead of draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            os: linux
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: tar.gz
            os: macos
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            os: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            os: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Slint system deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-cursor-dev libxcb-shm0-dev libxcb-xkb-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev libsecret-1-dev \
            libdbus-1-dev libssl-dev pkg-config cmake

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build GUI binaries
        shell: bash
        run: |
          set -e
          cargo build --release --locked --target ${{ matrix.target }}
          ls -la "target/${{ matrix.target }}/release" | head -20

      - name: Package release archive
        shell: bash
        run: |
          set -e
          STAGE="citrate-native-${{ matrix.target }}"
          mkdir -p "dist/$STAGE"
          TARGET_DIR="target/${{ matrix.target }}/release"

          # Copy all built binaries (Slint native GUIs)
          for entry in "$TARGET_DIR"/*; do
            name=$(basename "$entry")
            # Skip libraries, build artifacts, dirs we don't want
            if [[ -f "$entry" && -x "$entry" ]] || [[ "$name" == *.exe ]]; then
              # Heuristic: copy if it has no extension OR is .exe and is in the top-level (not deps/)
              case "$name" in
                *.d|*.rlib|*.so|*.dylib|*.dll|*.pdb) ;;
                *) cp "$entry" "dist/$STAGE/" 2>/dev/null || true ;;
              esac
            fi
          done

          cp LICENSE README.md "dist/$STAGE/" 2>/dev/null || true

          # Copy assets if any
          if [[ -d "assets" ]]; then
            cp -r assets "dist/$STAGE/"
          fi

          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a -tzip "${STAGE}.zip" "$STAGE/"
          else
            tar -czf "${STAGE}.tar.gz" "$STAGE/"
          fi

      - name: SHA256
        shell: bash
        run: |
          cd dist
          for f in citrate-native-${{ matrix.target }}.*; do
            if [[ -f "$f" ]]; then
              if [[ "${{ runner.os }}" == "macOS" ]]; then
                shasum -a 256 "$f" > "$f.sha256"
              else
                sha256sum "$f" > "$f.sha256"
              fi
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: citrate-native-${{ matrix.target }}
          path: dist/citrate-native-${{ matrix.target }}.*
          retention-days: 30

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps for SBOM
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config cmake
      - run: cargo install --locked cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename citrate-native-sbom
      - uses: actions/upload-artifact@v4
        with:
          name: citrate-native-sbom
          path: 'citrate-native-sbom*.json'
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [build, sbom]
    permissions:
      contents: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.json' \) -exec cp {} release-files/ \;
      - id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: citrate-native ${{ steps.tag.outputs.tag }}
          draft: ${{ !github.event.inputs.publish_release }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release-files/*
          body: |
            ## citrate-native ${{ steps.tag.outputs.tag }}

            Native Slint desktop application — operator + partner UI
            for the Citrate Network.

            ### Artifacts (per OS)
            - Linux x86_64 — tar.gz
            - macOS Intel + Apple Silicon — tar.gz
            - Windows x86_64 — zip

            See `citrate-compliance/runbooks/releases/gui-native.md`
            for install + first-run instructions.

            **Status**: unsigned-pre-release. macOS users will see
            Gatekeeper warning; right-click → Open to bypass.
            Windows users will see SmartScreen warning; click "More
            info" → "Run anyway" to bypass. Both warnings are
            resolved when code-signing certs are wired (see
            release ceremony prep audit's SIGNING_CHECKLIST.md).
