name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Free disk space (large link surface — chain + Slint + AI deps)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          df -h

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup SSH agent (3 deploy keys via per-host aliases)
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.CHAIN_DEPLOY_KEY }}
            ${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}
            ${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}

      - name: Configure SSH host aliases
        # NAT-B-025: pass the deploy keys through `env:` and reference them
        # as shell variables rather than splicing `${{ secrets.* }}`
        # directly into the script body — a secret value can no longer break
        # out of the surrounding shell context, and the key material never
        # appears in the rendered run: text.
        env:
          CHAIN_DEPLOY_KEY: ${{ secrets.CHAIN_DEPLOY_KEY }}
          LEARNING_CENTER_DEPLOY_KEY: ${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}
          AGENT_RUNTIME_DEPLOY_KEY: ${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # webfactory drops the keys in the agent but not on disk.
          # For per-host IdentityFile mapping, write them out from the
          # secrets (via env vars) so SSH config can point at files.
          umask 077
          printf '%s\n' "$CHAIN_DEPLOY_KEY" > ~/.ssh/citrate-chain-readonly
          printf '%s\n' "$LEARNING_CENTER_DEPLOY_KEY" > ~/.ssh/citrate-learning-center-readonly
          printf '%s\n' "$AGENT_RUNTIME_DEPLOY_KEY" > ~/.ssh/citrate-agent-runtime-readonly
          chmod 600 ~/.ssh/citrate-*-readonly

          cat > ~/.ssh/config <<'SSHEOF'
          Host github-citrate-chain
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-chain-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-learning-center
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-learning-center-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-agent-runtime
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-agent-runtime-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          SSHEOF
          chmod 600 ~/.ssh/config

          # Sanity check each alias
          for alias in github-citrate-chain github-citrate-learning-center github-citrate-agent-runtime; do
            ssh -T -o StrictHostKeyChecking=accept-new "$alias" 2>&1 | head -1 || true
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Install system deps (Slint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config libfontconfig1-dev libdbus-1-dev xvfb

      # NAT-B-022: these are real merge gates, not advisory. Pre-fix both
      # carried `continue-on-error: true`, so a fmt/clippy regression
      # (including clippy lints that catch several bug classes) could not
      # fail the build — the `-D warnings` was cosmetic.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Linux: wrap in xvfb so any display-probing dep has a virtual X server.
      # (The Slint tests themselves install a headless software-renderer
      # platform — see tests/e2e_visual.rs set_platform — so this is
      # belt-and-suspenders, not a hard requirement.)
      - name: cargo test (Linux)
        if: runner.os == 'Linux'
        env:
          CARGO_INCREMENTAL: 0
          CARGO_BUILD_JOBS: 2
        run: xvfb-run -a cargo test --workspace --locked --jobs 2 -- --test-threads=2

      # macOS has no xvfb (it's a Linux tool) and doesn't need one: the test
      # suite is display-independent and the runner provides Quartz. Run bare.
      - name: cargo test (macOS)
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 0
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace --locked --jobs 2 -- --test-threads=2
