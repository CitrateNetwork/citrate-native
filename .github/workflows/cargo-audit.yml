name: cargo audit (tripwire)

# REM-16 tripwire (2026-05-20 federation-split audit):
# Runs cargo-audit per-PR + weekly. Per the SOP at
# citrate-agentile-archive/sops/vulnerability-scanning.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 8 * * 1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # NAT-B-018 / NAT-B-036: fail if audit.toml (the assessor-facing
      # source of truth) and the inline --ignore list below have drifted.
      - name: Check advisory-ignore sync
        run: python3 scripts/ci/check_audit_ignore_sync.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # REM-16b (arkworks bump needed):
        #   RUSTSEC-2025-0055 — tracing-subscriber ANSI injection
        #   via ark-relations 0.4 transitive. See audit.toml.
        # 2026-07-09 (post-CI-outage triage): quick-xml 0194/0195 have no
        # semver-compatible fix here — both parents pin below 0.41:
        #   - quick-xml 0.31 via calamine 0.25 (citrate-learning-center
        #     pinned dep; runtime xlsx parsing — the REAL fix is a calamine
        #     bump in that repo; issue filed there, re-pin lifts this ignore)
        #   - quick-xml 0.39 via wayland-scanner proc-macro (build-time
        #     parsing of trusted Wayland protocol XML only; waits on the
        #     Slint/winit chain)
        run: |
          cargo audit \
            --color always \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
