[package]
name = "citrate-gui-native"
version = "0.4.0"
edition = "2021"
description = "Citrate desktop GUI — Rust-native Slint frontend"

[dependencies]
# Application core (headless orchestration)
citrate-desktop-app = { path = "../citrate_desktop_app" }

# BFR-INT-1 — Boeing FedRAMP panel adapters + live eth_call bindings.
# `citrate-rbac-bindings/live` enables the LiveXxxBindings impls that
# wrap `eth_call` against the chain 40204 deployments. Each adapter
# crate exposes a `fetch_*` / `assemble_*` function that takes typed
# binding trait objects and returns a `*PanelData` view model.
citrate-rbac-bindings = { path = "../citrate_rbac_bindings", features = ["live"] }
citrate-boeing-overview = { path = "../citrate_boeing_overview" }
citrate-boeing-provenance = { path = "../citrate_boeing_provenance" }
citrate-boeing-suppliers = { path = "../citrate_boeing_suppliers" }
citrate-boeing-fl = { path = "../citrate_boeing_fl" }
citrate-boeing-models-compute = { path = "../citrate_boeing_models_compute" }
citrate-boeing-apps-contracts = { path = "../citrate_boeing_apps_contracts" }
citrate-boeing-assistant = { path = "../citrate_boeing_assistant" }
citrate-boeing-governance = { path = "../citrate_boeing_governance" }
citrate-boeing-ontology = { path = "../citrate_boeing_ontology" }
thiserror = "1"

# Edu-app service layer — backs the CMO portal (E6.1.5) with eth_call
# wrappers for InstitutionTreeV1 + ComplianceRegistry. The GUI uses the
# service when contracts are deployed and falls back to CITRATE_CMO_DEMO
# stub data when the addresses are still ZERO_ADDRESS.
citrate-edu-app = { path = "../citrate_edu_app" }

# UI framework — use software renderer for compatibility (no GPU/OpenGL required)
slint = { version = "1.9", default-features = false, features = ["renderer-software", "backend-winit", "compat-1-2"] }

# Runtime
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

# Clipboard for copy buttons (mnemonic, addresses)
arboard = "3"
# Workspace-pinned to =0.8.6 — BACKLOG #124 tracks the 0.9 migration.
rand = { workspace = true }

# EIP-55 address checksumming
sha3 = "0.10"
hex = "0.4"

# Wallet core (for SALT→wei conversion in send flow)
citrate-wallet-core = { path = "../../wallet-core" }

# Agent substrate (for approval requests in tool executor)
citrate-agent-core = { path = "../../agent-core" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# IPFS daemon and HTTP client for Storage tab
citrate-storage = { path = "../../core/storage" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde_json = "1"
futures-util = "0.3"

# P960-C WP-C.1: native file picker. Pure Rust, uses xdg-dialog /
# gtk3 / common-controls-v6 depending on platform. Works with
# Slint's winit backend because rfd paints its own dialog chrome.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# P960-C WP-C.3: mime-type guessing from file extensions for the
# file-list view icons (no external daemon or network call).
mime_guess = "2"

# P960-C WP-C.3: serde for the persisted `files.json` index.
serde = { version = "1", features = ["derive"] }

# P960-D WP-D.1: hardware detection (CPU / RAM / optional NVIDIA
# GPU). sysinfo is pure-Rust, cross-platform. nvml-wrapper is
# NVIDIA-only with a runtime-load check — absence of the libnvml
# shared lib is handled gracefully (returns "no GPU detected").
sysinfo = "0.32"
nvml-wrapper = "0.10"

[dev-dependencies]
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.9"
