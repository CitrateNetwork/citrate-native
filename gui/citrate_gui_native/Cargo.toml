[package]
name = "citrate-gui-native"
version = "0.4.0"
edition = "2021"
description = "Citrate desktop GUI — Rust-native Slint frontend"

[dependencies]
# Application core (headless orchestration)
citrate-desktop-app = { path = "../citrate_desktop_app" }

# UI framework — use software renderer for compatibility (no GPU/OpenGL required)
slint = { version = "1.9", default-features = false, features = ["renderer-software", "backend-winit", "compat-1-2"] }

# Runtime
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

# Clipboard for copy buttons (mnemonic, addresses)
arboard = "3"
# Workspace-pinned to =0.8.6 — BACKLOG #124 tracks the 0.9 migration.
rand = { workspace = true }

# EIP-55 address checksumming
sha3 = "0.10"
hex = "0.4"

# Wallet core (for SALT→wei conversion in send flow)
citrate-wallet-core = { path = "../../wallet-core" }

# Agent substrate (for approval requests in tool executor)
citrate-agent-core = { path = "../../agent-core" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# IPFS daemon and HTTP client for Storage tab
citrate-storage = { path = "../../core/storage" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde_json = "1"
futures-util = "0.3"

# P960-C WP-C.1: native file picker. Pure Rust, uses xdg-dialog /
# gtk3 / common-controls-v6 depending on platform. Works with
# Slint's winit backend because rfd paints its own dialog chrome.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# P960-C WP-C.3: mime-type guessing from file extensions for the
# file-list view icons (no external daemon or network call).
mime_guess = "2"

# P960-C WP-C.3: serde for the persisted `files.json` index.
serde = { version = "1", features = ["derive"] }

# P960-D WP-D.1: hardware detection (CPU / RAM / optional NVIDIA
# GPU). sysinfo is pure-Rust, cross-platform. nvml-wrapper is
# NVIDIA-only with a runtime-load check — absence of the libnvml
# shared lib is handled gracefully (returns "no GPU detected").
sysinfo = "0.32"
nvml-wrapper = "0.10"

[dev-dependencies]
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.9"
