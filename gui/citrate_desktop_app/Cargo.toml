[package]
name = "citrate-desktop-app"
version = "0.4.0"
edition = "2021"
description = "Headless desktop application core — typed services, view models, and event bus for Citrate GUI"

[dependencies]
# Domain crates (authoritative — never forked)
citrate-consensus = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }
citrate-execution = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }
citrate-storage = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }
citrate-sequencer = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }
citrate-network = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }
citrate-economics = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }
citrate-api = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }

# Wallet core library
citrate-wallet-core = { git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", branch = "main" }

# Runtime
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
hex = "0.4"
primitive-types = "0.12"
anyhow = "1"
thiserror = "1"
dirs = "5"
async-trait = "0.1"

# Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha3 = "0.10"
rand = { workspace = true }

# IDE — Editor
ropey = "1.6"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# IDE — Terminal
vte = "0.13"
portable-pty = "0.8"

# IDE — Git
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }

# IDE — File Explorer
walkdir = "2.5"
ignore = "0.4"
notify = "7"

# IDE — Utilities
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# Agent substrate
citrate-agent-core = { git = "ssh://git@github-citrate-agent-runtime/CitrateNetwork/citrate-agent-runtime", branch = "main", package = "citrate-agent-legacy" }

# P960-J: MCP host HTTP listener for external agent runtimes (Hermes
# et al.). axum is already transitive via citrate-api; making it a
# direct dep so McpHostService owns its own router clearly.
axum = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
async-trait = "0.1"
tempfile = "3"
