[package]
license.workspace = true
name = "citrate-desktop-app"
version = "0.4.0"
edition = "2021"
description = "Headless desktop application core — typed services, view models, and event bus for Citrate GUI"

[dependencies]
# Domain crates (authoritative — never forked)
citrate-consensus = { workspace = true }
citrate-execution = { workspace = true }
citrate-storage = { workspace = true }
citrate-sequencer = { workspace = true }
citrate-network = { workspace = true }
citrate-economics = { workspace = true }
citrate-api = { workspace = true }

# Wallet core library
citrate-wallet-core = { workspace = true }

# Runtime
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
hex = "0.4"
primitive-types = "0.12"
anyhow = "1"
thiserror = "1"
dirs = "5"
async-trait = "0.1"

# Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha3 = "0.10"
# EW-S1 WP-8: PKCE S256 (sha2) + recoverable secp256k1 signing over the
# userOpHash (k256, version-matched to citrate-wallet-core's pin).
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = { workspace = true }
# ENCRYPT-S1 WP-4 (inventory A6): mcp_tokens.json is sealed with
# AES-256-GCM under an OS-keyring master key (see services/mcp_host.rs
# token vault). 0.10 is already in Cargo.lock transitively — no new
# crate versions enter the tree.
aes-gcm = "0.10"

# IDE — Editor
ropey = "1.6"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# IDE — Terminal
vte = "0.13"
portable-pty = "0.8"

# IDE — Git
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }

# IDE — File Explorer
walkdir = "2.5"
ignore = "0.4"
notify = "7"

# IDE — Utilities
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# Agent substrate
citrate-agent-core = { git = "ssh://git@github-citrate-agent-runtime/CitrateNetwork/citrate-agent-runtime", rev = "0db3da626962a53c9c3ad63397b19acd4dee8bad", package = "citrate-agent-legacy" }

# P960-J: MCP host HTTP listener for external agent runtimes (Hermes
# et al.). axum is already transitive via citrate-api; making it a
# direct dep so McpHostService owns its own router clearly.
axum = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
async-trait = "0.1"
tempfile = "3"
# ENCRYPT-S1 WP-1: raw-bytes probe that the embedded node's on-disk
# RocksDB values are ciphertext. Same version citrate-storage pins, so
# cargo unifies it into the existing rocksdb build (no new artifact).
rocksdb = "0.22"
