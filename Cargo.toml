[workspace]
# Slint-native desktop wallet + DAG explorer. Split from the Citrate
# monorepo on 2026-05-18. Chain crates come from CitrateNetwork/
# citrate-chain via SSH; edu-app from citrate-learning-center; agent
# from citrate-agent-runtime.
members = [
    "gui/citrate_ui_kit",
    "gui/citrate_native",
    "gui/citrate_desktop_app",
]
default-members = ["gui/citrate_native"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Citrate Network"]
license = "BUSL-1.1"
repository = "https://github.com/CitrateNetwork/citrate-native"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
sha3 = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
x25519-dalek = "2.0"
# Workspace pin: "0.8" (range, not an exact =). rand 0.9 is a
# breaking API migration (thread_rng→rng, gen→random, OsRng becomes
# TryCryptoRng). Our direct-use crates (consensus, execution, wallet,
# network, cli, etc.) still use the 0.8 API. Migration tracked in
# BACKLOG #124.
#
# We intentionally allow transitive consumers (e.g. rfd → ashpd →
# rand 0.9) to pull their own 0.9 copy. Cargo de-duplicates major-
# version trees, so direct consumers stay on 0.8 and the two versions
# coexist until the migration closes #124. Do NOT change this to an
# exact "=0.8.6" — that forces a resolution error on any crate that
# requires 0.9.
#
# Dependabot history: PRs #62, #83 (2026-04-22) both tried to bump
# this to 0.9.x. The `ignore` rule in dependabot.yml blocks
# semver-major/minor; the "security group" override bypassed it
# once. Keep this pin and close future Dependabot rand PRs with a
# pointer to BACKLOG #124 until the migration ships.
rand = "0.8"

# Networking
libp2p = "0.54"
quinn = "0.11"

# Storage
rocksdb = "0.22"
sled = "0.34"

# Time
chrono = "0.4"

# Concurrency
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Testing
# Pinned to 1.5.0 — proptest 1.11+ requires rand 0.9 which we haven't
# migrated to yet (BACKLOG #124). Workspace-wide pin here so every
# consumer stays on a version compatible with rand 0.8.6.
proptest = "=1.5.0"
criterion = "0.5"

# RM-M1b — Halo2-KZG zk-SNARK substrate.
# Pinned to PSE Halo2 main at commit `198e9ae30d322cd0ad003b6955f91ec095b1490d`
# (2025-07-07). Includes the multipoint-opening soundness fix (PR #400)
# that landed after v0.4.0 (2024-09-13). Pin selection is documented
# in ADR-RM-M1b-1 and enforced by `scripts/ci/check_m1b_halo2_pin.py`.
# Any pin bump REQUIRES an ADR amendment so the audit trail is honest.
#
# Behind core/execution/Cargo.toml's `halo2-substrate` feature flag.
# OFF by default; enabled when WP-M1b.4 wires the verifier into 0x0108.
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", rev = "198e9ae30d322cd0ad003b6955f91ec095b1490d", default-features = false }
halo2curves = { version = "0.7.0", default-features = false, features = ["bn256-table", "derive_serde"] }


# Cross-repo deps consumed via SSH deploy keys with per-host SSH config aliases
# (PSL-02: hoisted). Branch pins kept until chain publishes to crates.io.
# Note: deps with package = "..." overrides (citrate-agent-core →
# citrate-agent-legacy) stay inline in members because workspace inheritance
# + package rename has rough edges in older cargo.
#
# ENCRYPT-S1 WP-1: pinned to citrate-chain `feat/stor-encryption-at-rest`
# (HEAD 84ab969, PR #62) for at-rest RocksDB encryption
# (StorageConfig::with_encryption + crypto::at_rest). All chain-sourced
# crates move together as one rev.
# chain main incl. ENCRYPT-S1 WP-0 (PR #62 merged 2026-07-04)
citrate-wallet-core = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-storage     = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-consensus   = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-execution   = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-sequencer   = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-network     = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-economics   = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-api         = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-edu-app     = { git = "ssh://git@github-citrate-learning-center/CitrateNetwork/citrate-learning-center", rev = "9c1b5299e20c33b65f5ec6f09440ca9766e415da" }
#
# NAT-B-006 (HELD — upstream fix required): `citrate-edu-app`
# (citrate-learning-center) declares its OWN citrate-chain deps by
# `branch = "main"`. The resolver therefore materializes a SECOND copy of
# citrate-consensus/-execution/-security/-wallet-core at whatever `main`
# last pointed at — so the audited key-management rev (385e82e1) is not
# the only chain code this wallet links. The in-repo `[patch]` that would
# collapse them is REJECTED by cargo ("patches must point to different
# sources") because both the branch pin and the audited pin resolve from
# the same git URL. The real fix is upstream: pin edu-app's chain deps by
# `rev` (or add a workspace `[patch]` there) in citrate-learning-center.
# Until then `scripts/ci/check-chain-dep-pins.sh` is the enforcing guard —
# it fails while any duplicate/branch-tracking chain source remains, and
# goes green the moment the upstream pin lands.
#
# UPDATE 2026-09-24: edu-app@9c1b5299 now pins its chain deps by `rev`, but
# that rev (0f2d16b4) was orphaned by the citrate-chain history rewrite and
# is no longer fetchable ("revspec not found"), which broke every CI build.
# Since the direct deps above moved to the https URL, edu-app's
# `ssh://git@github-citrate-chain/...` source is now a *different* source,
# so the collapsing [patch] is accepted: every citrate-chain crate edu-app
# pulls resolves to the same audited rev as the wallet's own deps.
# Drop this once citrate-learning-center re-pins to a live https rev.

[patch."ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain"]
citrate-wallet-core = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }
citrate-security    = { git = "https://github.com/CitrateNetwork/citrate-chain", rev = "f4a07811940a0962325d18e8ba44fea0ff50a3b4" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
